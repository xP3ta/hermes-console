name: Release policy verification (no candidate artifacts)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-policy-verification-${{ github.ref }}
  cancel-in-progress: false

# CI verification only. Signed APK/AAB creation, comparison, attestation and
# staging stay on an owner-controlled private machine until publication.
jobs:
  verify:
    name: Verify immutable release source and policy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Verify tag, source identity and authoritative lock
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_REF_TYPE" == "tag" ]]
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]]
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "f366fdfc011b65c1b3f44e777fc876be21d3492ec3b0b0cf014536c0ac3490c3  pubspec.lock" \
            | sha256sum --strict -c -
          checkout_commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          build_number="$(sed -nE 's/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+)[[:space:]]*$/\1/p' pubspec.yaml)"
          [[ "$build_number" =~ ^(0|[1-9][0-9]*)$ ]]
          gh api "repos/$GITHUB_REPOSITORY/commits/$checkout_commit" \
            --jq '{authorLogin:.author.login,committerLogin:.committer.login,verification:(.commit.verification | {verified,reason,signature,payload,verified_at})}' \
            > "$RUNNER_TEMP/source-verification.json"
          python3 tool/release/verify_release_identity.py \
            --tag "$RELEASE_TAG" \
            --pubspec pubspec.yaml \
            --build-number "$build_number" \
            --expected-commit "$GITHUB_SHA" \
            --checkout-commit "$checkout_commit" \
            --tag-commit "$tag_commit" \
            --verification-json "$RUNNER_TEMP/source-verification.json" \
            --policy tool/release/release_contract.json

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.1'
          channel: stable

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Install and verify REUSE
        run: |
          python3 -m pip install --disable-pip-version-check reuse==6.2.0
          reuse lint

      - name: Scan Git history with pinned scanners
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            git /repo --no-banner --redact=100
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            trufflesecurity/trufflehog@sha256:ff4c95e9df7d645daf2140e3ca1039031c63106268d5fbb25feb43ceca1bcc33 \
            --no-update --fail --fail-on-scan-errors \
            --exclude-detectors=URI --results=verified,unknown \
            --json git file:///repo > "$RUNNER_TEMP/trufflehog.jsonl"
          test ! -s "$RUNNER_TEMP/trufflehog.jsonl"

      - name: Verify Gradle wrapper and checked-in SBOMs
        run: |
          set -Eeuo pipefail
          echo "76805e32c009c0cf0dd5d206bddc9fb22ea42e84db904b764f3047de095493f3  android/gradle/wrapper/gradle-wrapper.jar" \
            | sha256sum --strict -c -
          ./tool/sbom/generate.sh
          git diff --exit-code -- sbom

      - name: Run policy gates, analysis and tests
        run: |
          python3 -m unittest discover -s test -p '*_test.py'
          flutter analyze --fatal-infos
          flutter test --concurrency=1
