name: Code Quality Checks

on:
  pull_request:
    # Also the 1.2.15 integration and review-only bases, so reviewers see CI.
    branches: [main, 'feat/**', 'review/**']
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything but the Dart tests: policy gates, secret scans and analysis.
  checks:
    name: Policy and static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
        id: pub_get

      - name: Verify generated localizations
        run: |
          flutter gen-l10n
          git diff --exit-code -- \
            lib/l10n/app_localizations.dart \
            lib/l10n/app_localizations_en.dart \
            lib/l10n/app_localizations_es.dart

      - name: Install REUSE
        run: python3 -m pip install --disable-pip-version-check reuse==6.2.0

      - name: Verify REUSE compliance
        run: reuse lint

      - name: Scan Git history with Gitleaks
        env:
          GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          set -Eeuo pipefail
          # A clean scan only counts if the same config still catches a fresh token.
          tool/security/gitleaks_canary.sh
          # Scan only the history of the commit under test: a clone that holds
          # nothing but that commit and its ancestors (other remote branches
          # are not part of this build).
          rm -rf "$RUNNER_TEMP/scan" && mkdir "$RUNNER_TEMP/scan"
          git -C "$RUNNER_TEMP/scan" init -q
          git -C "$RUNNER_TEMP/scan" fetch -q --no-tags "$GITHUB_WORKSPACE" HEAD
          git -C "$RUNNER_TEMP/scan" checkout -q --detach FETCH_HEAD
          echo "history under scan: $(git -C "$RUNNER_TEMP/scan" rev-list --count HEAD) commits, tip $(git -C "$RUNNER_TEMP/scan" rev-parse --short HEAD)"
          cp "$GITHUB_WORKSPACE/.gitleaks.toml" "$RUNNER_TEMP/scan/.gitleaks.toml" 2>/dev/null || true
          docker run --rm \
            -v "$RUNNER_TEMP/scan:/repo:ro" \
            "$GITLEAKS_IMAGE" \
            git /repo --config /repo/.gitleaks.toml --no-banner --redact=100 --verbose

      - name: Scan verified and unknown secrets with TruffleHog
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/scan:/repo:ro" \
            trufflesecurity/trufflehog@sha256:674b2f187620a19df77f44cf9a7d77efcc581a5662accef2f2739cbb46ba4a3a \
            --no-update --fail --fail-on-scan-errors \
            --exclude-detectors=URI --results=verified,unknown \
            --json git --exclude-paths=/repo/tool/security/trufflehog_exclude_paths.txt file:///repo \
            > "$RUNNER_TEMP/trufflehog.jsonl"
          test ! -s "$RUNNER_TEMP/trufflehog.jsonl"

      - name: Verify Gradle wrapper and source SBOMs
        run: |
          echo "76805e32c009c0cf0dd5d206bddc9fb22ea42e84db904b764f3047de095493f3  android/gradle/wrapper/gradle-wrapper.jar" \
            | sha256sum -c -
          ./tool/sbom/generate.sh
          git diff --exit-code -- sbom

      - name: Run Python security and SBOM tests
        run: python3 -m unittest discover -s test -p '*_test.py'

      - name: Static analysis
        run: flutter analyze --fatal-infos

  # The Dart tests, split so no job runs for hours. Each job runs its own
  # share one file at a time, exactly as the single job did; the files are
  # dealt by tool/ci/test_shard.sh and test/ci_test_shards_test.py (run by
  # the checks job) proves no file is left out.
  tests:
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run tests
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(tool/ci/test_shard.sh "${{ matrix.shard }}" 6)
          echo "shard ${{ matrix.shard }}: ${#files[@]} files"
          test "${#files[@]}" -gt 0
          flutter test --concurrency=1 -x opt-in --reporter=expanded "${files[@]}"

  # test/chat_screen_test.dart alone is about a quarter of the suite: it is
  # split by test instead of by file.
  chat_screen_tests:
    name: Tests (chat screen ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run tests
        run: |
          flutter test --concurrency=1 -x opt-in --reporter=expanded \
            --total-shards 3 --shard-index "${{ matrix.shard }}" \
            test/chat_screen_test.dart

  # The one check branch protection asks for. It keeps the name the single
  # job had and passes only when every job above succeeded.
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    needs: [checks, tests, chat_screen_tests]
    if: always()
    steps:
      - name: Enforce checks
        env:
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.tests.result }}
          CHAT_SCREEN_TESTS: ${{ needs.chat_screen_tests.result }}
        run: |
          {
            echo "## Quality checks"
            echo "- Policy and static analysis: $CHECKS"
            echo "- Tests: $TESTS"
            echo "- Chat screen tests: $CHAT_SCREEN_TESTS"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$CHECKS" = success
          test "$TESTS" = success
          test "$CHAT_SCREEN_TESTS" = success
