version = 1
SPDX-PackageName = "Hermes Console"
SPDX-PackageSupplier = "Organization: XPeta Lab"
SPDX-PackageDownloadLocation = "https://github.com/xP3ta/hermes-console"

# Project-authored source, tests, documentation and build configuration.
# Central annotations keep binary/generated files auditable without adding
# thousands of format-specific header comments.
[[annotations]]
path = [
  ".github/**",
  ".gitignore",
  ".gitleaks.toml",
  ".metadata",
  "*.md",
  "ASSET_PROVENANCE.md",
  "CHANGELOG.md",
  "CODE_OF_CONDUCT.md",
  "CODE_QUALITY_CHECKLIST.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "NOTICE",
  "README.md",
  "REUSE.toml",
  "SECURITY.md",
  "analysis_options.yaml",
  "dart_test.yaml",
  "shaders/live_reply_tail.frag",
  "l10n.yaml",
  "pubspec.lock",
  "pubspec.yaml",
  "android/.gitignore",
  "android/app/**",
  "android/build.gradle.kts",
  "android/gradle.properties",
  "android/settings.gradle.kts",
  "assets/branding/**",
  "assets/icon/**",
  "docs/**",
  "lib/**",
  "shaders/liquid_glass.frag",
  "sbom/**",
  "scripts/**",
  "server-patches/**",
  "specs/**",
  "test/**",
  "test_tools/**",
  "tool/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 XPeta Lab"
SPDX-License-Identifier = "GPL-3.0-only"

# This notice contains both project-authored commentary and the preserved MIT
# attribution/text for the upstream fork.
[[annotations]]
path = "THIRD_PARTY_NOTICES.md"
precedence = "override"
SPDX-FileCopyrightText = [
  "Copyright (c) 2026 XPeta Lab",
  "Copyright (c) rusty4444 and hermes-android contributors",
]
SPDX-License-Identifier = "GPL-3.0-only AND MIT"

# Checked-in Gradle wrapper files are unmodified Apache-2.0 distribution files.
[[annotations]]
path = [
  "android/gradle/wrapper/**",
  "android/gradlew",
  "android/gradlew.bat",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2015 the original author or authors"
SPDX-License-Identifier = "Apache-2.0"

# Bundled font binaries retain the SIL Open Font License.
[[annotations]]
path = "assets/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) the respective font authors"
SPDX-License-Identifier = "OFL-1.1"

# Project-owned companion manifests and sprites were dedicated under CC0.
[[annotations]]
path = "assets/companions/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 XPeta Lab"
SPDX-License-Identifier = "CC0-1.0"

# Header atlases retain the CC0 dedication of their companion source sheets.
[[annotations]]
path = "assets/mascot/*.webp"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 XPeta Lab"
SPDX-License-Identifier = "CC0-1.0"

# Project-authored licence/provenance commentary, not the CC0 legal code.
[[annotations]]
path = "assets/mascot/LICENSES.md"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 XPeta Lab"
SPDX-License-Identifier = "GPL-3.0-only"

# Test-only verbatim copy of Hermes Agent's generated gateway wire contract
# (tool/contract/update_contract.sh; upstream commit in SOURCE). Never packaged.
[[annotations]]
path = "test/fixtures/contract/gateway-contract.openrpc.json"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2025 Nous Research"
SPDX-License-Identifier = "MIT"

# Provider-logo path data copied unchanged from Simple Icons 16.1.0
# (CC0-1.0); see ASSET_PROVENANCE.md. Brand marks remain their owners'.
[[annotations]]
path = "lib/core/widgets/provider_logo_glyphs.dart"
precedence = "override"
SPDX-FileCopyrightText = "Simple Icons contributors"
SPDX-License-Identifier = "CC0-1.0"

# Link brand glyphs of «Artefactos»: Hermes Desktop's host table with
# Simple Icons 16.8.0 path data (CC0-1.0); see ASSET_PROVENANCE.md. Brand
# marks remain their owners'.
[[annotations]]
path = "lib/core/widgets/link_brand_glyphs.dart"
precedence = "override"
SPDX-FileCopyrightText = "Simple Icons contributors"
SPDX-License-Identifier = "CC0-1.0"

# Provider-logo path data copied from LobeHub Icons
# (@lobehub/icons-static-svg@1.95.1, MIT); see ASSET_PROVENANCE.md and
# THIRD_PARTY_NOTICES.md. Brand marks remain their owners'.
[[annotations]]
path = "lib/core/widgets/provider_logo_glyphs_lobehub.dart"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2023 LobeHub"
SPDX-License-Identifier = "MIT"

# Official Google Play badge artwork, unmodified, used only to link to the
# Play listing (see LICENSES/LicenseRef-Google-Play-Badge.txt).
[[annotations]]
path = "docs/badges/google-play-*.png"
precedence = "override"
SPDX-FileCopyrightText = "Copyright Google LLC"
SPDX-License-Identifier = "LicenseRef-Google-Play-Badge"

# Obtainium's own "Get it on Obtainium" badge (ImranR98/Obtainium, assets/graphics).
[[annotations]]
path = "docs/badges/obtainium.png"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) Obtainium contributors"
SPDX-License-Identifier = "GPL-3.0-only"

# noVNC core (vendored for the bot-screen viewer). The library default is
# MPL-2.0; see assets/novnc/LICENSE.txt and assets/novnc/docs/LICENSE.MPL-2.0.
# core/crypto/des.js keeps its own BSD-style grant and is annotated apart.
[[annotations]]
path = [
  "assets/novnc/core/*.js",
  "assets/novnc/core/decoders/**",
  "assets/novnc/core/input/**",
  "assets/novnc/core/util/**",
  "assets/novnc/core/crypto/aes.js",
  "assets/novnc/core/crypto/bigint.js",
  "assets/novnc/core/crypto/crypto.js",
  "assets/novnc/core/crypto/dh.js",
  "assets/novnc/core/crypto/md5.js",
  "assets/novnc/core/crypto/rsa.js",
  "assets/novnc/LICENSE.txt",
  "assets/novnc/docs/LICENSE.MPL-2.0",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (C) The noVNC Authors"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = "assets/novnc/core/crypto/des.js"
precedence = "override"
SPDX-FileCopyrightText = [
  "Copyright (C) 1999 AT&T Laboratories Cambridge",
  "Copyright (c) 1996 Widget Workshop, Inc.",
  "Copyright (C) 1996 Jef Poskanzer",
]
SPDX-License-Identifier = "LicenseRef-noVNC-DES"

# pako, bundled by noVNC for zlib in the browser.
[[annotations]]
path = "assets/novnc/vendor/pako/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (C) 2014-2016 Vitaly Puzrin"
SPDX-License-Identifier = "MIT"

# Project-authored pages that load the vendored noVNC core and relay its
# socket.
[[annotations]]
path = [
  "assets/novnc/bridge.html",
  "assets/novnc/null-origin-socket.js",
  "assets/novnc/ws-relay.html",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 XPeta Lab"
SPDX-License-Identifier = "GPL-3.0-only"

# Hermes Desktop's in-page act engine and overlay (hermes-agent,
# apps/desktop/src/lib/preview-act), generated with one Console privacy
# patch; see THIRD_PARTY_NOTICES.md and tool/browser/.
[[annotations]]
path = "lib/core/browser/hermes_preview_engine.g.dart"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2025 Nous Research"
SPDX-License-Identifier = "MIT"

# Console's port of preview-act.ts: its script templates are copied from
# Hermes Desktop (MIT); the rest is this project's.
[[annotations]]
path = "lib/core/browser/agent_preview_act.dart"
precedence = "override"
SPDX-FileCopyrightText = [
  "Copyright (c) 2026 XPeta Lab",
  "Copyright (c) 2025 Nous Research",
]
SPDX-License-Identifier = "GPL-3.0-only AND MIT"

# The live chat's ten icons: frame strips derived from the MIT-licensed
# Generative Icons library (https://generativeicons.com, LottieFiles). See
# assets/chat_icons/LICENSE.txt and ASSET_PROVENANCE.md.
[[annotations]]
path = "assets/chat_icons/*.webp"
precedence = "override"
SPDX-FileCopyrightText = "Generative Icons (LottieFiles); frame strips Copyright (c) 2026 XPeta Lab"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  "assets/chat_icons/LICENSE.txt",
  "assets/chat_icons/SOURCES.json",
  "assets/chat_icons/atlas.json",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 XPeta Lab"
SPDX-License-Identifier = "GPL-3.0-only"
