version = 1
SPDX-PackageName = "Hermes Console"
SPDX-PackageSupplier = "Organization: XPeta Lab"
SPDX-PackageDownloadLocation = "https://github.com/xP3ta/hermes-console"

# Project-authored source, tests, documentation and build configuration.
# Central annotations keep binary/generated files auditable without adding
# thousands of format-specific header comments.
[[annotations]]
path = [
  ".github/**",
  ".gitignore",
  ".gitleaks.toml",
  ".metadata",
  "*.md",
  "ASSET_PROVENANCE.md",
  "CHANGELOG.md",
  "CODE_OF_CONDUCT.md",
  "CODE_QUALITY_CHECKLIST.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "NOTICE",
  "README.md",
  "REUSE.toml",
  "SECURITY.md",
  "analysis_options.yaml",
  "l10n.yaml",
  "pubspec.lock",
  "pubspec.yaml",
  "android/.gitignore",
  "android/app/**",
  "android/build.gradle.kts",
  "android/gradle.properties",
  "android/settings.gradle.kts",
  "assets/branding/**",
  "assets/bridge/**",
  "assets/icon/**",
  "docs/**",
  "lib/**",
  "sbom/**",
  "scripts/**",
  "server-patches/**",
  "specs/**",
  "test/**",
  "test_tools/**",
  "tool/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 XPeta Lab"
SPDX-License-Identifier = "GPL-3.0-only"

# This notice contains both project-authored commentary and the preserved MIT
# attribution/text for the upstream fork.
[[annotations]]
path = "THIRD_PARTY_NOTICES.md"
precedence = "override"
SPDX-FileCopyrightText = [
  "Copyright (c) 2026 XPeta Lab",
  "Copyright (c) rusty4444 and hermes-android contributors",
]
SPDX-License-Identifier = "GPL-3.0-only AND MIT"

# Checked-in Gradle wrapper files are unmodified Apache-2.0 distribution files.
[[annotations]]
path = [
  "android/gradle/wrapper/**",
  "android/gradlew",
  "android/gradlew.bat",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2015 the original author or authors"
SPDX-License-Identifier = "Apache-2.0"

# Bundled font binaries retain the SIL Open Font License.
[[annotations]]
path = "assets/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) the respective font authors"
SPDX-License-Identifier = "OFL-1.1"

# Project-owned companion manifests and sprites were dedicated under CC0.
[[annotations]]
path = "assets/companions/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 XPeta Lab"
SPDX-License-Identifier = "CC0-1.0"
